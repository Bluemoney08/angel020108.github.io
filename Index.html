<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angel Orozco | Engineering Portfolio</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #08111f;
        color: white;
        line-height: 1.6;
    }

    /* Navigation */
    nav {
        position: fixed;
        top: 0;
        width: 100%;
        background: rgba(8, 17, 31, 0.95);
        border-bottom: 1px solid #26384d;
        z-index: 1000;
    }

    .nav-container {
        max-width: 1100px;
        margin: auto;
        padding: 18px 25px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .logo {
        font-size: 1.4rem;
        font-weight: bold;
        color: #4db8ff;
    }

    nav ul {
        list-style: none;
        display: flex;
        gap: 30px;
    }

    nav a {
        color: #d8e5f2;
        text-decoration: none;
        transition: 0.3s;
    }

    nav a:hover {
        color: #4db8ff;
    }

    /* Hero */
    .hero {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 120px 25px 80px;

        background:
            radial-gradient(
                circle at center,
                rgba(0, 140, 255, 0.18),
                transparent 40%
            ),
            linear-gradient(135deg, #08111f, #101d30);
    }

    .hero-content {
        max-width: 850px;
    }

    .hero h1 {
        font-size: clamp(3rem, 8vw, 6rem);
        margin-bottom: 20px;
    }

    .hero h1 span {
        color: #4db8ff;
    }

    .hero h2 {
        font-size: 1.5rem;
        font-weight: normal;
        color: #b6c6d8;
        margin-bottom: 25px;
    }

    .hero p {
        max-width: 700px;
        margin: auto;
        color: #91a4b8;
        font-size: 1.1rem;
    }

    .button {
        display: inline-block;
        margin-top: 35px;
        padding: 14px 28px;
        background: #4db8ff;
        color: #06101a;
        font-weight: bold;
        text-decoration: none;
        border-radius: 8px;
        transition: 0.3s;
    }

    .button:hover {
        background: #82ceff;
        transform: translateY(-3px);
    }

    /* Sections */
    section {
        max-width: 1100px;
        margin: auto;
        padding: 100px 25px;
    }

    .section-title {
        font-size: 2.4rem;
        margin-bottom: 45px;
    }

    .section-title span {
        color: #4db8ff;
    }

    /* About */
    .about {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 60px;
        align-items: center;
    }

    .about-text p {
        color: #a8b8c9;
        margin-bottom: 18px;
    }

    .focus-box {
        background: #101c2c;
        border: 1px solid #2a3e55;
        padding: 30px;
        border-radius: 12px;
    }

    .focus-box h3 {
        color: #4db8ff;
        margin-bottom: 20px;
    }

    .focus-box ul {
        list-style: none;
    }

    .focus-box li {
        padding: 12px 0;
        border-bottom: 1px solid #243447;
        color: #c7d4e1;
    }

    /* Projects */
    .projects {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 25px;
    }

    .project-card {
        background: #101c2c;
        border: 1px solid #2a3e55;
        padding: 30px;
        border-radius: 12px;
        transition: 0.3s;
    }

    .project-card:hover {
        transform: translateY(-6px);
        border-color: #4db8ff;
    }

    .project-number {
        color: #4db8ff;
        font-size: 0.85rem;
        font-weight: bold;
        letter-spacing: 2px;
    }

    .project-card h3 {
        margin: 12px 0;
        font-size: 1.5rem;
    }

    .project-card p {
        color: #9dafc0;
    }

    /* Skills */
    .skills {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
    }

    .skill {
        background: #101c2c;
        border: 1px solid #2a3e55;
        padding: 25px;
        border-radius: 10px;
    }

    .skill h3 {
        color: #4db8ff;
        margin-bottom: 10px;
    }

    .skill p {
        color: #9dafc0;
    }

    /* Interests */
    .interests {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 25px;
    }

    .interest {
        background: #101c2c;
        border: 1px solid #2a3e55;
        padding: 30px;
        border-radius: 12px;
    }

    .interest h3 {
        margin-bottom: 10px;
    }

    .interest p {
        color: #9dafc0;
    }

    /* Contact */
    .contact {
        max-width: none;
        text-align: center;
        background: #0d1827;
        border-top: 1px solid #26384d;
    }

    .contact-content {
        max-width: 700px;
        margin: auto;
    }

    .contact p {
        color: #9dafc0;
    }

    /* Footer */
    footer {
        text-align: center;
        padding: 30px;
        color: #65788d;
        background: #07101c;
    }

    /* Mobile */
    @media (max-width: 750px) {

        nav ul {
            display: none;
        }

        .about,
        .projects,
        .skills,
        .interests {
            grid-template-columns: 1fr;
        }

        .hero h1 {
            font-size: 3.5rem;
        }

        .hero h2 {
            font-size: 1.2rem;
        }
    }
</style>
